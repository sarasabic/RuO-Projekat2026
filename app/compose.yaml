name: ruo

services:
  frontend:
    build: ./frontend
    image: ruo/frontend:1.0
    environment:
      BACKEND_URL: http://backend:8000   
    ports:
      - "80:3000"                        
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  backend:
    build: ./backend
    image: ruo/backend:1.0
    environment:
      DB_HOST: db                       
      DB_NAME: quiz
      DB_USER: quiz_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in app/.env}
    depends_on:
      db: { condition: service_healthy } 
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in app/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in app/.env}   # read by db/init/01-roles.sh
    volumes:
      - dbdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d quiz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    
volumes:
  dbdata: