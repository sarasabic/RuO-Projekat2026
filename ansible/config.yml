
- name: Base configuration of all VMs
  hosts: all
  become: true
  gather_facts: false               
  pre_tasks:                        
    - name: Wait until SSH is reachable (the VM may still be booting)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait until cloud-init has finished (it creates our admin user)
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false               
      failed_when: cloud_init.rc not in [0, 2]  

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common

- name: Docker host
  hosts: app                        
  become: true
  roles:
    - docker