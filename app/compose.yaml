
name: ruo

services:
  frontend:
    build: ./frontend
    image: ruo/frontend:1.0
    pull_policy: build                   
    environment:
      BACKEND_URL: http://backend.${ZONE:?set ZONE}:8000   
    ports:
      - "80:3000"                        
    dns:
      - ${DNS_SERVER:?set DNS_SERVER}    
    networks:
      web: { ipv4_address: 10.30.1.10 }
      app: { ipv4_address: 10.30.2.20 }
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  backend:
    build: ./backend
    image: ruo/backend:1.0
    pull_policy: build                   
    environment:
      DB_HOST: db.${ZONE:?set ZONE}      
      DB_NAME: quiz
      DB_USER: quiz_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    dns:
      - ${DNS_SERVER:?set DNS_SERVER}    
    networks:                            
      app: { ipv4_address: 10.30.2.10 }
      db: { ipv4_address: 10.30.3.20 }
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}   # read by db/init/01-roles.sh on the first start
    volumes:
      - dbdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d quiz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:                           
      db: { ipv4_address: 10.30.3.10 }
    restart: unless-stopped

volumes:
  dbdata:

networks:
  web:
    ipam:
      config: [{ subnet: 10.30.1.0/24 }]
  app:
    ipam:
      config: [{ subnet: 10.30.2.0/24 }]
  db:
    internal: true                       
    ipam:
      config: [{ subnet: 10.30.3.0/24 }]