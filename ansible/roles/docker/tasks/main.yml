
- name: Docker's signing key (verifies that packages really come from Docker)
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring }}"
    mode: "0644"                    

- name: Docker's apt repository, trusted only with that key 
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: "{{ docker_apt_keyring }}"   
  register: docker_repo

- name: Package list is refreshed right after the repository was added
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed                   

- name: Docker Engine, Compose and Buildx are installed
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    cache_valid_time: 3600
    lock_timeout: 600

- name: Docker is running and starts at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Admin user may use docker without sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true                    
  loop: "{{ docker_users }}"